services:
  postgres:
    image: postgres:17-alpine
    container_name: sync-postgres
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
